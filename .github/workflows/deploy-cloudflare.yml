name: Deploy to Cloudflare

# Manual only: Actions → "Deploy to Cloudflare" → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # Builds ../Dockerfile with the runner's Docker, pushes it to Cloudflare's registry,
      # and deploys the Worker + container.
      - run: npx wrangler deploy

      # Copy any repository secrets that are set into Worker secrets (empty ones are skipped).
      - name: Sync secrets
        env:
          POLYFI_DASHBOARD_TOKEN: ${{ secrets.POLYFI_DASHBOARD_TOKEN }}
          SIGNER_PRIVATE_KEY: ${{ secrets.SIGNER_PRIVATE_KEY }}
          POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
          POLYMARKET_RELAYER_API_KEY: ${{ secrets.POLYMARKET_RELAYER_API_KEY }}
          POLYMARKET_RELAYER_API_KEY_ADDRESS: ${{ secrets.POLYMARKET_RELAYER_API_KEY_ADDRESS }}
          POLYMARKET_SESSION_PRIVATE_KEY: ${{ secrets.POLYMARKET_SESSION_PRIVATE_KEY }}
        run: |
          for name in POLYFI_DASHBOARD_TOKEN SIGNER_PRIVATE_KEY POLYMARKET_WALLET_ADDRESS \
                      POLYMARKET_RELAYER_API_KEY POLYMARKET_RELAYER_API_KEY_ADDRESS POLYMARKET_SESSION_PRIVATE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "set $name"
            fi
          done
